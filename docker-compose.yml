services:
  lernplattform:
    build: .
    container_name: lernplattform
    restart: unless-stopped
    ports:
      - "8091:8080"
    environment:
      - TZ=Europe/Berlin
      - APP_PASSWORD=${APP_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      - SITE_TITLE=${SITE_TITLE:-Tim’s Feuerwehr Lernplattform}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - BILD_TOKEN=${BILD_TOKEN:-}
    volumes:
      # Inhalte direkt aus dem Ordner lesen: neue Themen sind nach "git pull" sofort da
      - ./content:/app/content:ro

  # Optional: Zugang aus dem Internet über Cloudflare Tunnel
  # (ohne Portfreigabe am Router). Start mit:  docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: lernplattform-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - lernplattform
    profiles:
      - tunnel
