<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#b3121f">
  <title>Lernplattform</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon.svg">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menü öffnen">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a href="#/" class="brand">
      <img src="/assets/icon.svg" alt="" width="32" height="32">
      <span id="siteTitle">Lernplattform</span>
    </a>
    <form class="search" id="searchForm" role="search">
      <input type="search" id="searchInput" placeholder="Suchen …" aria-label="Inhalte durchsuchen">
    </form>
    <form method="post" action="/logout" class="logout">
      <button class="icon-btn" title="Abmelden" aria-label="Abmelden">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Inhalte"></nav>
    <div class="backdrop" id="backdrop"></div>
    <main class="content" id="main" tabindex="-1">
      <p class="muted">Lädt …</p>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
